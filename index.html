<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda Juan y Caren</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de control arriba, calendario a la izquierda, panel de efectividad a la derecha (apilado en móvil). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eceff4; --fg:#161b26; --muted:#5d667a; --line:#dde2ea; --line2:#eef1f5;
  --ink:#161b26; --on-ink:#ffffff; --ok:#1c8a4f; --bad:#c23a3a; --now:#e0452b; --today:#e7edfb;
  --c1:#3b6fe0; --c2:#8a5bd6; --c3:#23a06a; --c4:#d99a1c; --c5:#d6498f; --c6:#14899c; --c7:#e2692c; --c8:#7b8aa3;
  --shadow:0 8px 30px rgba(20,28,45,.14);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171c27; --surface2:#1f2633; --fg:#e8ecf4; --muted:#97a1b6; --line:#2a3242; --line2:#212837;
  --ink:#e8ecf4; --on-ink:#0f131b; --ok:#4cc585; --bad:#ef7676; --now:#ff6a4d; --today:#1d2a47;
  --c1:#6e97f2; --c2:#a98af0; --c3:#4cc589; --c4:#eab94d; --c5:#ef7bb4; --c6:#47bfd1; --c7:#f2905a; --c8:#9aa8c0;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --surface2:#1f2633; --fg:#e8ecf4; --muted:#97a1b6; --line:#2a3242; --line2:#212837;
  --ink:#e8ecf4; --on-ink:#0f131b; --ok:#4cc585; --bad:#ef7676; --now:#ff6a4d; --today:#1d2a47;
  --c1:#6e97f2; --c2:#a98af0; --c3:#4cc589; --c4:#eab94d; --c5:#ef7bb4; --c6:#47bfd1; --c7:#f2905a; --c8:#9aa8c0;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4;padding-inline:16px;padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.app{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg .who-j[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--c1),0 1px 3px rgba(0,0,0,.15)}
.seg .who-c[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--c5),0 1px 3px rgba(0,0,0,.15)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad)}
.nav{display:flex;align-items:center;gap:6px}
.nav .title{font-family:var(--f-display);font-weight:500;font-size:20px;min-width:0;padding-inline:6px;text-transform:none}
.status{font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
/* Mes */
.mh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mh div{padding:8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface2)}
.cell.out{opacity:.45}
.cell.today{background:var(--today)}
.dn{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell.today .dn b{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:1px 7px}
.dn b{font-weight:500}
.dn .pct{font-size:10px}
.chip{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 5px;border-radius:4px;border-left:3px solid var(--cat);background:color-mix(in srgb,var(--cat) 20%,var(--surface));min-width:0;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chip .h{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.chip.done .t{text-decoration:line-through;opacity:.7}
.chip .ck{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--cat);flex:none;display:grid;place-items:center;font-size:8px;line-height:1;color:#fff}
.chip.done .ck{background:var(--ok);border-color:var(--ok)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:640px){
  .cell{min-height:64px;padding:4px 3px;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px}
  .dn{width:100%}
  .mg .chip{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--cat);flex:none}
  .mg .chip .t,.mg .chip .h,.mg .chip .ck{display:none}
  .mg .chip.done{opacity:.35}
  .more{display:none}
  h1{font-size:22px}
}
/* Semana y día */
.scroller{overflow:auto;max-height:74vh;position:relative}
.tg{--gw:52px}
.tg-head,.tg-body{display:grid;grid-template-columns:var(--gw) repeat(var(--n),minmax(var(--minw),1fr))}
.tg-top{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-head .corner{position:sticky;left:0;background:var(--surface);z-index:5}
.dh{padding:8px 6px;text-align:center;border-left:1px solid var(--line2);cursor:pointer}
.dh span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh b{font-family:var(--f-display);font-size:20px;font-weight:500}
.dh.today b{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:0 9px}
.gutter{position:sticky;left:0;z-index:3;background:var(--surface);height:calc(var(--hh)*24);position:sticky}
.gutter i{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-style:normal;font-size:10.5px;color:var(--muted)}
.col{position:relative;height:calc(var(--hh)*24);border-left:1px solid var(--line2);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line2) 1px,transparent 1px);
  background-size:100% var(--hh),100% calc(var(--hh)/2);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.col.today{background-color:color-mix(in srgb,var(--today) 45%,transparent)}
.blk{position:absolute;padding:3px 6px 3px 7px;border-radius:6px;border-left:4px solid var(--cat);background:color-mix(in srgb,var(--cat) 24%,var(--surface));overflow:hidden;font-size:12px;cursor:pointer;line-height:1.25;box-shadow:0 0 0 1px var(--surface)}
.blk:hover{background:color-mix(in srgb,var(--cat) 34%,var(--surface));z-index:2}
.blk .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.blk .tt{font-weight:700;overflow-wrap:anywhere}
.blk.done .tt{text-decoration:line-through;opacity:.7}
.blk .ck{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--cat);background:var(--surface);display:grid;place-items:center;font-size:11px;color:#fff;padding:0;line-height:1}
.blk.done .ck{background:var(--ok);border-color:var(--ok)}
.blk .who{font-size:10px;font-weight:700;color:var(--muted);margin-left:4px}
.ghost{position:absolute;left:2px;right:2px;border:2px dashed var(--fg);border-radius:6px;background:color-mix(in srgb,var(--fg) 10%,transparent);pointer-events:none;z-index:6;font-family:var(--f-mono);font-size:11px;padding:2px 6px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:5;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.hint{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
/* Panel */
.side{display:flex;flex-direction:column;gap:14px}
.panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0}
.gauge{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.ring .v small{display:block;font-family:var(--f-body);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.gtxt{display:flex;flex-direction:column;gap:4px;min-width:0}
.gtxt b{font-family:var(--f-display);font-size:18px}
.gtxt span{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.kv span{font-size:11px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:9px}
.row .lb{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px}
.row .lb span:last-child{font-family:var(--f-mono);color:var(--muted)}
.track{height:7px;background:var(--surface2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--cat);border-radius:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--cat);margin-right:7px}
.empty{color:var(--muted);font-size:12.5px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;margin:auto}
.modal h3{margin:0;font-family:var(--f-display);font-size:20px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:56px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.g3{grid-template-columns:1fr 1fr}.g3 .fld:first-child{grid-column:1/-1}}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12.5px;display:flex;align-items:center}
.cats button .dot{margin-right:6px;border-radius:50%}
.cats button[aria-pressed="true"]{border-color:var(--cat);background:color-mix(in srgb,var(--cat) 20%,var(--surface));font-weight:700}
.donechk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2);cursor:pointer}
.donechk input{width:20px;height:20px;accent-color:var(--ok)}
.err{color:var(--bad);font-size:12.5px;min-height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60}
@media (prefers-reduced-motion:no-preference){.chip,.blk,.cell{transition:background .12s}}

.chip.ad{background:color-mix(in srgb,var(--cat) 48%,var(--surface));font-weight:700;border-left-width:3px}
.tg-ad{display:grid;grid-template-columns:var(--gw) repeat(var(--n),minmax(var(--minw),1fr));border-top:1px solid var(--line2)}
.tg-ad .lab{position:sticky;left:0;background:var(--surface);font-size:10px;color:var(--muted);padding:7px 5px;text-align:right;letter-spacing:.03em;z-index:5;line-height:1.2}
.adc{border-left:1px solid var(--line2);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:28px;cursor:pointer;min-width:0}
.adc:hover{background:var(--surface2)}
.repbox{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}
.inl{display:flex;gap:8px;align-items:center}.inl input{width:76px!important}.inl span{color:var(--muted);font-size:12.5px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:500;padding:0}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cats .addcat{border-style:dashed;color:var(--muted)}
.nc,.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nc input[type=text],.crow input[type=text]{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.nc input[type=color],.crow input[type=color]{width:44px;height:36px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;flex:none;cursor:pointer}
.clist{display:flex;flex-direction:column;gap:8px}
.rowbtn{display:block;width:100%;background:none;border:0;padding:5px 6px;border-radius:8px;text-align:left}
.rowbtn:hover{background:var(--surface2)}
.rowbtn.on{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--cat)}
.panel h2 .lnk{float:right;font-family:var(--f-body);font-weight:500;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;text-transform:none}
.tl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border-left:4px solid var(--cat);background:color-mix(in srgb,var(--cat) 14%,var(--surface));cursor:pointer;min-width:0}
.tl .ckb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--cat);background:var(--surface);flex:none;display:grid;place-items:center;font-size:11px;color:#fff;padding:0}
.tl li.done .ckb{background:var(--ok);border-color:var(--ok)}
.tl li.done .tx{text-decoration:line-through;opacity:.7}
.tl .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer}.chk input{width:18px;height:18px}
.tg{min-width:calc(52px + var(--n)*var(--minw))}
</style>

<div class="app">
  <div class="top">
    <h1>Agenda Juan y Caren<small id="status"></small></h1>
    <div class="bar">
      <div class="seg" id="who" role="group" aria-label="Persona">
        <button class="who-j" data-who="Juan" aria-pressed="false">Juan</button>
        <button class="who-c" data-who="Caren" aria-pressed="false">Caren</button>
        <button data-who="Ambos" aria-pressed="false">Ambos</button>
      </div>
      <div class="seg" id="views" role="group" aria-label="Vista">
        <button data-view="month" aria-pressed="false">Mes</button>
        <button data-view="week" aria-pressed="false">Semana</button>
        <button data-view="day" aria-pressed="false">Día</button>
      </div>
      <button class="btn" id="cats">Categorías</button>
      <button class="btn primary" id="add">+ Actividad</button>
    </div>
  </div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Anterior">‹</button>
    <button class="btn" id="today">Hoy</button>
    <button class="btn" id="next" aria-label="Siguiente">›</button>
    <div class="title" id="title"></div>
  </div>
  <div class="main">
    <div class="card" id="cal"></div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function(){
const DEFAULTS=[
 {id:'c1',n:'Trabajo'},{id:'c2',n:'Estudio'},{id:'c3',n:'Salud y deporte'},{id:'c4',n:'Hogar'},
 {id:'c5',n:'Pareja y familia'},{id:'c6',n:'Finanzas'},{id:'c7',n:'Social'},{id:'c8',n:'Descanso'}];
const PRESETS=['#e11d48','#0ea5e9','#84cc16','#a855f7','#f59e0b','#14b8a6','#f43f5e','#64748b'];
const USERS=['Juan','Caren'];
const HH=44;
const DOW=['lun','mar','mié','jue','vie','sáb','dom'];
const DL=['L','M','X','J','V','S','D'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon0=d=>addDays(d,-((d.getDay()+6)%7));
const dayDiff=(a,b)=>Math.round((a-b)/864e5);
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const hmEnd=m=>m>=1440?'24:00':hm(m);
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(d,o)=>new Intl.DateTimeFormat('es',o).format(d);
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const $=id=>document.getElementById(id);

let st={view:'month',who:'Ambos',cur:new Date(),acts:[],catF:null};
try{const p=JSON.parse(localStorage.getItem('agenda-prefs')||'{}');if(p.view)st.view=p.view;if(p.who)st.who=p.who}catch(e){}
let col=null,ccol=null,mode='local',scrollTop=null,needScroll=true;

/* ---------- Categorías ---------- */
let customCats=[],CL=[];
function buildCL(){
  const base=DEFAULTS.map(c=>{const o=customCats.find(x=>x.id===c.id);return {id:c.id,n:(o&&o.n)||c.n,color:(o&&o.color)||null,def:true,over:!!o}});
  const extra=customCats.filter(x=>!DEFAULTS.some(d=>d.id===x.id)).map(x=>({id:x.id,n:x.n,color:x.color||'#64748b',def:false}));
  CL=base.concat(extra);
}
buildCL();
const catOf=id=>CL.find(c=>c.id===id)||{id:'x',n:'Sin categoría',color:'#7b8aa3'};
const catCss=id=>{const c=catOf(id);return c.color||('var(--'+c.id+')')};
function tokenHex(id){const v=getComputedStyle(document.documentElement).getPropertyValue('--'+id).trim();return /^#[0-9a-f]{6}$/i.test(v)?v:'#7b8aa3'}

/* ---------- Persistencia ---------- */
function loadLocal(){
  try{st.acts=JSON.parse(localStorage.getItem('agenda-acts')||'[]')}catch(e){st.acts=[]}
  try{customCats=JSON.parse(localStorage.getItem('agenda-cats')||'[]')}catch(e){customCats=[]}
  buildCL();
}
function saveLocal(){try{localStorage.setItem('agenda-acts',JSON.stringify(st.acts))}catch(e){}}
function saveLocalCats(){try{localStorage.setItem('agenda-cats',JSON.stringify(customCats))}catch(e){}}
function savePrefs(){try{localStorage.setItem('agenda-prefs',JSON.stringify({view:st.view,who:st.who}))}catch(e){}}
async function put(a){
  if(col){try{await col.doc(a.id).set(a)}catch(e){toast('No se pudo guardar. Intenta de nuevo.')}}
  else{const i=st.acts.findIndex(x=>x.id===a.id);if(i>=0)st.acts[i]=a;else st.acts.push(a);saveLocal();render()}
}
async function del(id){
  if(col){try{await col.doc(id).delete()}catch(e){toast('No se pudo eliminar.')}}
  else{st.acts=st.acts.filter(x=>x.id!==id);saveLocal();render()}
}
async function putCat(c){
  const i=customCats.findIndex(x=>x.id===c.id);if(i>=0)customCats[i]=c;else customCats.push(c);buildCL();
  if(ccol){try{await ccol.doc(c.id).set(c)}catch(e){toast('No se pudo guardar la categoría.')}}else saveLocalCats();
  render();
}
async function delCat(id){
  customCats=customCats.filter(x=>x.id!==id);buildCL();
  if(st.catF===id)st.catF=null;
  if(ccol){try{await ccol.doc(id).delete()}catch(e){toast('No se pudo eliminar la categoría.')}}else saveLocalCats();
  render();
}
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};
const loadJS=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function initStore(){
  let db=null,fs=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){col=db.collection('acts');ccol=db.collection('cats')}
  else if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId){
    try{
      const b='https://www.gstatic.com/firebasejs/10.12.2/';
      await loadJS(b+'firebase-app-compat.js');await loadJS(b+'firebase-firestore-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();
      col=fs.collection('acts');ccol=fs.collection('cats');
    }catch(e){col=null;ccol=null;toast('No se pudo conectar con Firebase. Se guarda solo en este navegador.')}
  }
  if(col){
    mode='shared';
    col.onSnapshot(s=>{st.acts=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{col=null;ccol=null;mode='local';loadLocal();render();toast('Sin conexión con la base compartida.')});
    ccol.onSnapshot(s=>{customCats=s.docs.map(d=>({...d.data(),id:d.id}));buildCL();render()},()=>{});
  }else loadLocal();
  render();
}

/* ---------- Repeticiones ---------- */
function occ(m,s){
  return {...m,date:s,occ:s,series:!!m.rep,allDay:!!m.allDay,start:m.allDay?0:m.start,end:m.allDay?1440:m.end,
    done:m.rep?!!(m.ov&&m.ov[s]&&m.ov[s].done):!!m.done};
}
function ruleHits(r,d,sd){
  const n=Math.max(1,r.n||1);
  if(r.t==='d')return dayDiff(d,sd)%n===0;
  if(r.t==='w'){
    const days=(r.days&&r.days.length)?r.days:[(sd.getDay()+6)%7];
    const wk=Math.round(dayDiff(mon0(d),mon0(sd))/7);
    return wk%n===0&&days.includes((d.getDay()+6)%7);
  }
  if(r.t==='m'){
    const mo=(d.getFullYear()-sd.getFullYear())*12+d.getMonth()-sd.getMonth();
    if(mo%n)return false;
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return d.getDate()===Math.min(sd.getDate(),last);
  }
  return false;
}
function occurrences(m,fromS,toS){
  if(!m.rep)return (m.date>=fromS&&m.date<=toS)?[occ(m,m.date)]:[];
  const sd=parse(m.date),from=parse(fromS),to=parse(toS);
  const r=m.rep;
  const until=r.end==='date'&&r.until?parse(r.until):null;
  const maxC=r.end==='count'?Math.max(1,r.count||1):Infinity;
  const out=[];let d=new Date(sd),c=0,g=0;
  while(d<=to&&g++<6000){
    if(until&&d>until)break;
    if(ruleHits(r,d,sd)){
      c++;if(c>maxC)break;
      if(d>=from){const s=ymd(d);if(!(m.ov&&m.ov[s]&&m.ov[s].del))out.push(occ(m,s))}
    }
    d=addDays(d,1);
  }
  return out;
}
const inRange=(f,t)=>st.acts.flatMap(m=>occurrences(m,f,t));
const pass=a=>(st.who==='Ambos'||a.user===st.who)&&(!st.catF||a.cat===st.catF);
const forDay=(list,s)=>list.filter(a=>a.date===s).sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||a.start-b.start||a.end-b.end);
const isDue=a=>parse(a.date).getTime()+a.end*60000<=Date.now();
const getOcc=(id,o)=>{const m=st.acts.find(x=>x.id===id);return m?occ(m,o||m.date):null};
function lanes(list){
  const out=[];let cluster=[],cEnd=-1;
  const flush=()=>{const n=Math.max(1,...cluster.map(c=>c.lane+1));cluster.forEach(c=>{c.n=n;out.push(c)});cluster=[];cEnd=-1};
  list.forEach(a=>{
    if(a.start>=cEnd&&cluster.length)flush();
    const used=cluster.filter(c=>c.a.end>a.start).map(c=>c.lane);
    let l=0;while(used.includes(l))l++;
    cluster.push({a,lane:l});cEnd=Math.max(cEnd,a.end);
  });
  if(cluster.length)flush();
  return out;
}
function repText(r){
  if(!r)return '';
  const n=r.n||1;
  const u={d:['día','días'],w:['semana','semanas'],m:['mes','meses']}[r.t];
  let t=n===1?'Cada '+u[0]:'Cada '+n+' '+u[1];
  if(r.t==='w'&&r.days&&r.days.length)t+=' ('+r.days.map(i=>DOW[i]).join(', ')+')';
  if(r.end==='date'&&r.until)t+=' hasta el '+fmt(parse(r.until),{day:'numeric',month:'short',year:'numeric'});
  if(r.end==='count')t+=', '+r.count+' veces';
  return t;
}

/* ---------- Render ---------- */
function titleText(){
  const c=st.cur;
  if(st.view==='month')return cap(fmt(c,{month:'long',year:'numeric'}));
  if(st.view==='day')return cap(fmt(c,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  const a=mon0(c),b=addDays(a,6);
  return fmt(a,{day:'numeric',month:'short'})+' – '+fmt(b,{day:'numeric',month:'short',year:'numeric'});
}
function render(){
  document.querySelectorAll('#who button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.who===st.who));
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===st.view));
  $('title').textContent=titleText();
  $('status').textContent=mode==='shared'?'Compartida: Juan y Caren ven los mismos cambios':'Guardada solo en este navegador';
  const sc=document.querySelector('.scroller');if(sc)scrollTop=sc.scrollTop;
  if(st.view==='month')renderMonth();else renderGrid(st.view==='week'?7:1);
  renderSide();
  const s2=document.querySelector('.scroller');
  if(s2){
    if(needScroll){s2.scrollTop=Math.max(0,(7*HH)-4);needScroll=false}
    else if(scrollTop!=null)s2.scrollTop=scrollTop;
  }
}
function chipHTML(a,showUser){
  const tip=a.title+(a.allDay?' · todo el día':' · '+hm(a.start)+'–'+hmEnd(a.end))+(a.series?' · '+repText(a.rep):'');
  return `<button class="chip ${a.done?'done':''} ${a.allDay?'ad':''}" style="--cat:${catCss(a.cat)}" data-edit="${esc(a.id)}" data-occ="${a.date}" title="${esc(tip)}">
    <span class="ck" data-toggle="${esc(a.id)}" data-occ="${a.date}">${a.done?'✓':''}</span>${a.allDay?'':`<span class="h">${hm(a.start)}</span>`}<span class="t">${a.series?'↻ ':''}${esc(a.title)}${showUser?' · '+esc(a.user[0]):''}</span></button>`;
}
function renderMonth(){
  const first=new Date(st.cur.getFullYear(),st.cur.getMonth(),1);
  const start=mon0(first);
  const last=new Date(st.cur.getFullYear(),st.cur.getMonth()+1,0);
  const weeks=Math.ceil((dayDiff(last,start)+1)/7);
  const list=inRange(ymd(start),ymd(addDays(start,weeks*7-1))).filter(pass);
  const todayS=ymd(new Date());
  let h='<div class="mh">'+DOW.map(d=>`<div>${d}</div>`).join('')+'</div><div class="mg">';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),s=ymd(d);
    const items=forDay(list,s);
    const done=items.filter(a=>a.done).length;
    const out=d.getMonth()!==st.cur.getMonth();
    h+=`<div class="cell ${out?'out':''} ${s===todayS?'today':''}" data-day="${s}">
      <div class="dn"><b>${d.getDate()}</b>${items.length?`<span class="pct">${done}/${items.length}</span>`:''}</div>
      ${items.slice(0,3).map(a=>chipHTML(a,st.who==='Ambos')).join('')}
      ${items.length>3?`<div class="more">+${items.length-3} más</div>`:''}</div>`;
  }
  h+='</div><div class="hint">Toca un día para ver sus 24 horas y asignar actividades por rango de hora. El símbolo ↻ marca las que se repiten.</div>';
  $('cal').innerHTML=h;
}
function renderGrid(n){
  const base=n===7?mon0(st.cur):new Date(st.cur.getFullYear(),st.cur.getMonth(),st.cur.getDate());
  const days=[];for(let i=0;i<n;i++)days.push(addDays(base,i));
  const list=inRange(ymd(days[0]),ymd(days[n-1])).filter(pass);
  const todayS=ymd(new Date());
  const minw=n===7?'104px':'260px';
  let h=`<div class="scroller"><div class="tg" style="--n:${n};--minw:${minw};--hh:${HH}px">
    <div class="tg-top"><div class="tg-head"><div class="corner"></div>${days.map(d=>`<div class="dh ${ymd(d)===todayS?'today':''}" data-day="${ymd(d)}"><span>${DOW[(d.getDay()+6)%7]}</span><b>${d.getDate()}</b></div>`).join('')}</div>
    <div class="tg-ad"><div class="lab">todo el día</div>${days.map(d=>{const s=ymd(d);return `<div class="adc" data-adday="${s}">${forDay(list,s).filter(a=>a.allDay).map(a=>chipHTML(a,st.who==='Ambos')).join('')}</div>`}).join('')}</div></div>
    <div class="tg-body"><div class="gutter">${Array.from({length:23},(_,i)=>`<i style="top:${(i+1)*HH}px">${pad(i+1)}:00</i>`).join('')}</div>`;
  days.forEach(d=>{
    const s=ymd(d);
    const items=lanes(forDay(list,s).filter(a=>!a.allDay));
    h+=`<div class="col ${s===todayS?'today':''}" data-col="${s}">`;
    items.forEach(({a,lane,n:nn})=>{
      const top=a.start/60*HH,ht=Math.max(18,(a.end-a.start)/60*HH-1);
      h+=`<div class="blk ${a.done?'done':''}" data-edit="${esc(a.id)}" data-occ="${a.date}" style="--cat:${catCss(a.cat)};top:${top}px;height:${ht}px;left:calc(${lane}/${nn}*100% + 1px);width:calc(100%/${nn} - 3px)">
        <button class="ck" data-toggle="${esc(a.id)}" data-occ="${a.date}" aria-label="Marcar como hecha">${a.done?'✓':''}</button>
        <div class="tm">${hm(a.start)}–${hmEnd(a.end)}${a.series?' ↻':''}${st.who==='Ambos'?`<span class="who">${esc(a.user)}</span>`:''}</div>
        <div class="tt">${esc(a.title)}</div></div>`;
    });
    if(s===todayS){const now=new Date();h+=`<div class="nowline" style="top:${(now.getHours()*60+now.getMinutes())/60*HH}px"></div>`}
    h+='</div>';
  });
  h+=`</div></div></div><div class="hint">Arrastra sobre las horas para elegir un rango. En el celular, toca una hora libre. Toca la franja "todo el día" para crear un evento de día completo.</div>`;
  $('cal').innerHTML=h;
}
function stats(list){
  const due=list.filter(isDue);
  const doneDue=due.filter(a=>a.done).length;
  const done=list.filter(a=>a.done);
  const hrs=arr=>arr.filter(a=>!a.allDay).reduce((s,a)=>s+(a.end-a.start),0)/60;
  return {inM:list,due,doneDue,done,pct:due.length?Math.round(doneDue/due.length*100):null,hPlan:hrs(list),hDone:hrs(done)};
}
function renderSide(){
  const y=st.cur.getFullYear(),mo=st.cur.getMonth();
  const f=ymd(new Date(y,mo,1)),t=ymd(new Date(y,mo+1,0));
  const monthAll=inRange(f,t);
  const whoOk=a=>st.who==='Ambos'||a.user===st.who;
  const S=stats(monthAll.filter(pass));
  const mname=fmt(st.cur,{month:'long',year:'numeric'});
  const R=44,C=2*Math.PI*R,pct=S.pct;
  const col_=pct==null?'var(--muted)':pct>=70?'var(--ok)':pct>=50?'var(--c4)':'var(--bad)';
  const label=pct==null?'Sin datos aún':pct>=85?'Excelente':pct>=70?'Buena':pct>=50?'Regular':'Por mejorar';
  const pend=S.inM.length-S.done.length;
  const who=st.who==='Ambos'?'Juan y Caren':st.who;
  let h=`<div class="card panel"><h2>Efectividad de ${esc(mname)}</h2>
   <div class="gauge"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
     <circle cx="50" cy="50" r="${R}" fill="none" stroke="${col_}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(pct||0)/100)}"/></svg>
     <div class="v"><div>${pct==null?'—':pct+'%'}<small>cumplido</small></div></div></div>
     <div class="gtxt"><b>${label}</b><span>${S.doneDue} de ${S.due.length} vencidas hechas</span><span>${esc(who)}${st.catF?' · '+esc(catOf(st.catF).n):''}</span></div></div>
   <div class="kv"><div><b>${S.inM.length}</b><span>Programadas</span></div><div><b>${S.done.length}</b><span>Hechas</span></div><div><b>${pend}</b><span>Pendientes</span></div></div>
   <div class="row"><div class="lb"><span>Horas cumplidas</span><span>${S.hDone.toFixed(1)} / ${S.hPlan.toFixed(1)} h</span></div>
     <div class="track" style="--cat:var(--ok)"><i style="width:${S.hPlan?S.hDone/S.hPlan*100:0}%"></i></div></div></div>`;
  // Hoy
  const today=new Date(),ts=ymd(today);
  const td=forDay(inRange(ts,ts).filter(pass),ts);
  const tdDone=td.filter(a=>a.done).length;
  h+=`<div class="card panel"><h2>Hoy · ${tdDone}/${td.length}</h2>`;
  h+=td.length?`<ul class="tl">`+td.map(a=>`<li class="${a.done?'done':''}" style="--cat:${catCss(a.cat)}" data-edit="${esc(a.id)}" data-occ="${a.date}">
     <button class="ckb" data-toggle="${esc(a.id)}" data-occ="${a.date}" aria-label="Marcar como hecha">${a.done?'✓':''}</button>
     <span class="tx">${a.series?'↻ ':''}${esc(a.title)}${st.who==='Ambos'?' · '+esc(a.user[0]):''}</span><span class="tm">${a.allDay?'todo el día':hm(a.start)}</span></li>`).join('')+`</ul>`
    :`<div class="empty">No hay actividades para hoy.</div>`;
  h+=`</div>`;
  // Personas
  h+=`<div class="card panel"><h2>Juan y Caren</h2><div class="rows">`+USERS.map(u=>{
    const s=stats(monthAll.filter(a=>a.user===u&&(!st.catF||a.cat===st.catF)));
    return `<div class="row"><div class="lb"><span>${u}</span><span>${s.pct==null?'—':s.pct+'%'} · ${s.done.length}/${s.inM.length}</span></div>
      <div class="track" style="--cat:var(--${u==='Juan'?'c1':'c5'})"><i style="width:${s.pct||0}%"></i></div></div>`}).join('')+`</div></div>`;
  // Categorías
  const base=monthAll.filter(whoOk);
  h+=`<div class="card panel"><h2>Categorías<button class="lnk" data-managecats="1">Gestionar</button></h2><div class="rows">`+
   CL.map(c=>{
    const arr=base.filter(a=>a.cat===c.id),d=arr.filter(a=>a.done).length;
    return `<button class="rowbtn ${st.catF===c.id?'on':''}" data-catf="${c.id}" style="--cat:${catCss(c.id)}" title="Toca para filtrar el calendario por esta categoría">
      <div class="row"><div class="lb"><span><span class="dot"></span>${esc(c.n)}</span><span>${d}/${arr.length}</span></div>
      <div class="track"><i style="width:${arr.length?d/arr.length*100:0}%"></i></div></div></button>`}).join('')+`</div>
    <div class="note">${st.catF?'Filtrando por '+esc(catOf(st.catF).n)+'. Toca la categoría otra vez para quitar el filtro.':'Toca una categoría para filtrar el calendario.'}</div></div>`;
  $('side').innerHTML=h;
}

    const b=e.target.closest('button');if(!b)return;
    if(b.id==='newcat'){const nc=$('nc');nc.hidden=!nc.hidden;if(!nc.hidden){$('nc-c').value=PRESETS[customCats.length%PRESETS.length];$('nc-n').focus()}return}
    m.cat=b.dataset.cat;drawCats();
  };
  const makeCat=async()=>{
    const n=$('nc-n').value.trim();if(!n){$('nc-n').focus();return}
    const c={id:'x'+Date.now().toString(36),n,color:$('nc-c').value};
    await putCat(c);m.cat=c.id;$('nc-n').value='';$('nc').hidden=true;drawCats();
  };
  $('nc-ok').onclick=makeCat;
  $('nc-n').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();makeCat()}});
  // todo el día
  const syncAll=()=>{$('times').hidden=$('f-all').checked};
  $('f-all').onchange=syncAll;syncAll();
  // repetición
  const dayBtns=[...document.querySelectorAll('#days button')];
  const dateVal=()=>$('f-date').value?parse($('f-date').value):parse(a.date);
  const syncRep=()=>{
    const t=$('f-rep').value;
    $('rep-box').hidden=!t;
    $('wk').hidden=t!=='w';
    $('f-unit').textContent={d:'día(s)',w:'semana(s)',m:'mes(es)'}[t]||'';
    const e=$('f-endt').value;
    $('end-date').hidden=e!=='date';$('end-count').hidden=e!=='count';
    if(t==='w'&&!dayBtns.some(b=>b.getAttribute('aria-pressed')==='true')){
      const wd=(dateVal().getDay()+6)%7;dayBtns[wd].setAttribute('aria-pressed','true');
    }
  };
  $('f-rep').onchange=syncRep;$('f-endt').onchange=syncRep;
  $('days').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
  if(rep){
    $('f-rep').value=rep.t;$('f-n').value=rep.n||1;$('f-endt').value=rep.end||'never';
    if(rep.until)$('f-until').value=rep.until;if(rep.count)$('f-count').value=rep.count;
    (rep.days||[]).forEach(i=>dayBtns[i]&&dayBtns[i].setAttribute('aria-pressed','true'));
  }
  syncRep();
  // eliminar
  const arm=(btn,fn)=>{let armed=false;const txt=btn.textContent;btn.onclick=async()=>{if(!armed){armed=true;btn.textContent='¿Seguro? Toca otra vez';return}await fn();close()}};
  if($('f-del'))arm($('f-del'),()=>del(master.id));
  if($('f-delall'))arm($('f-delall'),()=>del(master.id));
  if($('f-del1'))arm($('f-del1'),()=>put({...master,ov:{...(master.ov||{}),[a.occ]:{...((master.ov||{})[a.occ]||{}),del:true}}}));
  // guardar
  $('mf').onsubmit=async e=>{
    e.preventDefault();
    const err=t=>{$('f-err').textContent=t};
    const allDay=$('f-all').checked;
    let s=0,en=1440;
    if(!allDay){
      if(!$('f-start').value||!$('f-end').value){err('Elige la hora de inicio y fin.');return}
      s=toMin($('f-start').value);en=toMin($('f-end').value);
      if(en===0&&s>0)en=1440;
      if(en<=s){err('La hora final debe ser después de la inicial.');return}
    }
    const dateIn=$('f-date').value||a.date;
    if(!dateIn){err('Elige una fecha.');return}
    if(!m.cat){err('Elige una categoría.');return}
    const title=$('f-title').value.trim();
    if(!title){err('Escribe el nombre de la actividad.');return}
    let r=null;
    const t=$('f-rep').value;
    if(t){
      r={t,n:Math.max(1,Math.min(60,parseInt($('f-n').value,10)||1)),end:$('f-endt').value,until:null,count:null,days:[]};
      if(t==='w')r.days=dayBtns.map((b,i)=>b.getAttribute('aria-pressed')==='true'?i:-1).filter(i=>i>=0);
      if(r.end==='date'){r.until=$('f-until').value;if(!r.until){err('Elige hasta qué día se repite.');return}if(r.until<dateIn){err('La fecha final es anterior al inicio.');return}}
      if(r.end==='count')r.count=Math.max(1,Math.min(500,parseInt($('f-count').value,10)||1));
    }
    const done=$('f-done').checked;
    const id=master?master.id:('a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    let ov={...((master&&master.ov)||{})};
    let date=dateIn,dn=false;
    if(r){
      date=series?master.date:dateIn;
      const k=series?a.occ:dateIn;
      ov[k]={...(ov[k]||{}),done};
    }else{ov={};dn=done}
    const rec={id,title,user:$('f-user').value,date,allDay,start:s,end:en,cat:m.cat,notes:$('f-notes').value.trim(),done:dn,rep:r,ov};
    close();await put(rec);
    st.cur=parse(series?(a.occ||dateIn):dateIn);render();
  };
  setTimeout(()=>$('f-title').focus(),30);
}
function newAct(date,start,end,allDay){
  openModal({date:date||ymd(st.cur),start:start==null?540:start,end:end==null?600:end,allDay:!!allDay,user:st.who==='Ambos'?'Juan':st.who,cat:st.catF||CL[0].id,title:'',notes:'',done:false});
}

/* ---------- Gestor de categorías ---------- */
function openCats(){
  const root=$('modal-root');
  const draw=()=>{
    root.innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Categorías">
      <h3>Categorías</h3>
      <div class="note">Cambia el nombre o el color de cualquier categoría. Los cambios se ven en todo el calendario.</div>
      <div class="clist">${CL.map(c=>{
        const hex=c.color||tokenHex(c.id);
        return `<div class="crow"><input type="color" data-cc="${c.id}" value="${esc(hex)}" aria-label="Color de ${esc(c.n)}"><input type="text" data-cn="${c.id}" value="${esc(c.n)}" maxlength="30" aria-label="Nombre">
        ${c.def?(c.over?`<button class="btn" data-reset="${c.id}">Restablecer</button>`:''):`<button class="btn danger" data-cdel="${c.id}">Eliminar</button>`}</div>`}).join('')}</div>
      <div class="fld"><span class="lbl">Nueva categoría</span><div class="nc"><input type="text" id="nc-n" maxlength="30" placeholder="Ej: Clientes" aria-label="Nombre de la nueva categoría"><input type="color" id="nc-c" value="${PRESETS[customCats.length%PRESETS.length]}" aria-label="Color"><button class="btn primary" id="nc-ok">Agregar</button></div></div>
      <div class="note">Al eliminar una categoría, sus actividades quedan como "Sin categoría" en gris.</div>
      <div class="acts"><span class="sp"></span><button class="btn" id="c-close">Listo</button></div></div></div>`;
    $('c-close').onclick=close;
    $('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close()});
    const add=async()=>{const n=$('nc-n').value.trim();if(!n){$('nc-n').focus();return}await putCat({id:'x'+Date.now().toString(36),n,color:$('nc-c').value});draw()};
    $('nc-ok').onclick=add;
    $('nc-n').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    root.querySelectorAll('[data-cc]').forEach(inp=>inp.onchange=async()=>{
      const c=CL.find(x=>x.id===inp.dataset.cc);await putCat({id:c.id,n:c.n,color:inp.value});draw()});
    root.querySelectorAll('[data-cn]').forEach(inp=>inp.onchange=async()=>{
      const c=CL.find(x=>x.id===inp.dataset.cn);const n=inp.value.trim()||c.n;await putCat({id:c.id,n,color:c.color});draw()});
    root.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{await delCat(b.dataset.reset);draw()});
    root.querySelectorAll('[data-cdel]').forEach(b=>{let armed=false;b.onclick=async()=>{if(!armed){armed=true;b.textContent='¿Seguro?';return}await delCat(b.dataset.cdel);draw()}});
  };
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',esc_)};
  const esc_=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',esc_);
  draw();
}
function toast(t){const r=$('toast-root');r.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{r.innerHTML=''},3200)}

/* ---------- Eventos ---------- */
$('who').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.who=b.dataset.who;savePrefs();render()};
$('views').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.view=b.dataset.view;needScroll=true;savePrefs();render()};
$('today').onclick=()=>{st.cur=new Date();needScroll=true;render()};
function step(k){
  const c=st.cur;
  if(st.view==='month')st.cur=new Date(c.getFullYear(),c.getMonth()+k,1);
  else st.cur=addDays(c,k*(st.view==='week'?7:1));
  render();
}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('cats').onclick=openCats;
$('add').onclick=()=>{
  const n=new Date();const h=Math.min(23,n.getHours()+1)*60;
  newAct(st.view==='month'?ymd(new Date()):ymd(st.cur),h,Math.min(1440,h+60));
};
function doToggle(id,o){
  const m=st.acts.find(x=>x.id===id);if(!m)return;
  if(m.rep){const ov={...(m.ov||{})};ov[o]={...(ov[o]||{}),done:!(ov[o]&&ov[o].done)};put({...m,ov})}
  else put({...m,done:!m.done});
}
function handleClick(e){
  const t=e.target.closest('[data-toggle]');
  if(t){e.stopPropagation();doToggle(t.dataset.toggle,t.dataset.occ);return true}
  const ed=e.target.closest('[data-edit]');
  if(ed){e.stopPropagation();const a=getOcc(ed.dataset.edit,ed.dataset.occ);if(a)openModal(a);return true}
  return false;
}
$('cal').addEventListener('click',e=>{
  if(handleClick(e))return;
  const ad=e.target.closest('.adc');
  if(ad){newAct(ad.dataset.adday,0,1440,true);return}
  const cell=e.target.closest('.cell');
  if(cell){st.cur=parse(cell.dataset.day);st.view='day';needScroll=true;savePrefs();render();return}
  const dh=e.target.closest('.dh');
  if(dh){st.cur=parse(dh.dataset.day);st.view='day';needScroll=true;savePrefs();render();return}
  const c=e.target.closest('.col');
  if(c&&lastPtr!=='mouse'){
    const r=c.getBoundingClientRect();const mn=Math.floor((e.clientY-r.top)/HH*2)*30;
    newAct(c.dataset.col,mn,Math.min(1440,mn+60));
  }
});
$('side').addEventListener('click',e=>{
  if(handleClick(e))return;
  if(e.target.closest('[data-managecats]')){openCats();return}
  const cf=e.target.closest('[data-catf]');
  if(cf){st.catF=st.catF===cf.dataset.catf?null:cf.dataset.catf;render()}
});
/* Arrastrar un rango de horas con el mouse */
let lastPtr='',drag=null;
$('cal').addEventListener('pointerdown',e=>{
  lastPtr=e.pointerType;
  if(e.pointerType!=='mouse'||e.button!==0)return;
  const c=e.target.closest('.col');if(!c||e.target.closest('.blk'))return;
  const r=c.getBoundingClientRect();
  const snap=y=>Math.max(0,Math.min(1440,Math.round((y-r.top)/HH*2)*30));
  const a=Math.min(1410,Math.floor((e.clientY-r.top)/HH*2)*30);
  const g=document.createElement('div');g.className='ghost';c.appendChild(g);
  drag={g,a,b:a+30,date:c.dataset.col};
  const draw=()=>{const s=Math.min(drag.a,drag.b),en=Math.max(drag.a,drag.b);g.style.top=s/60*HH+'px';g.style.height=(en-s)/60*HH+'px';g.textContent=hm(s)+'–'+hmEnd(en)};
  draw();
  const mv=ev=>{
    const y=snap(ev.clientY);
    drag.b=y>drag.a?y:(y<drag.a?y:drag.a+30);
    draw();
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    const s=Math.min(drag.a,drag.b),en=Math.max(drag.a,drag.b);
    const d=drag.date;g.remove();drag=null;
    newAct(d,s,Math.max(en,s+30));
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  e.preventDefault();
});

initStore();
setInterval(()=>{if(!$('modal-root').innerHTML&&!drag)render()},60000);
})();
</script>
